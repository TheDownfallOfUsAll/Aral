# SQLite creates this database file automatically when the API starts.
spring.datasource.url=${DB_URL:jdbc:sqlite:./arallink.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
server.error.include-stacktrace=never
server.port=8080

# Override this when the frontend runs on a different origin.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
