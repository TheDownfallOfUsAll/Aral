# Create the dbCRUD1 database in MySQL before starting the API.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbCRUD1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Let Hibernate detect the MySQL dialect from the configured JDBC connection.
spring.jpa.hibernate.ddl-auto=update
server.error.include-stacktrace=never
server.port=8080

# Override this when the frontend runs on a different origin.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
